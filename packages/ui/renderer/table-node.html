@if (resource() !== undefined && !source()) {
<p role="alert">{{ localization.message('remote.unconfigured') }}</p>
} @else if (!source() && projectedRows() === null) {
<p role="alert">{{ localization.message('table.error.rows') }}</p>
} @else {
<haven-table
  [source]="source()"
  [owner]="owner()"
  [editMode]="editMode()"
  [itemSchema]="itemSchema()"
  [editHandler]="editHandler()"
  [remoteEditHandler]="remoteEditHandler()"
  [editActive]="editActive()"
  [editors]="renderer().host().tableEditors"
  [tooltips]="renderer().host().tableTooltips"
  [filters]="renderer().host().tableFilters"
  [filterActive]="filterActive()"
  [columnFilters]="columnFilters()"
  (columnFiltersChange)="updateColumnFilters($event)"
  [rowActions]="rowActions()"
  (editCommitted)="committed($event)"
  (rowAction)="invokeRow($event)"
  [query]="query()"
  (queryChange)="updateQuery($event)"
  [cellRenderers]="renderer().host().tableCellRenderers"
  [disabled]="state().disabled"
  [readonly]="state().readonly"
  [filterable]="node().props?.['filterable'] === true"
  [selectable]="node().props?.['selectable'] === true"
  [exportable]="node().props?.['exportable'] === true"
  [columnMenu]="node().props?.['columnMenu'] === true"
  [filter]="filter()"
  (filterChange)="updateFilter($event)"
  [selection]="selection()"
  (selectionChange)="updateSelection($event)"
  [view]="view()"
  (viewChange)="updateView($event)"
  [rows]="rows()"
  [columns]="columns()"
  [headerGroups]="headerGroups()"
  [virtualization]="virtualization()"
  [hierarchy]="hierarchy()"
  [hierarchyActive]="hierarchyActive()"
  [expandedRowKeys]="expandedRowKeys()"
  (expandedRowKeysChange)="updateExpansion($event)"
  [rowKey]="text('rowKey')"
  [pageSize]="pageSize()"
  [title]="text('title')"
/>
}
