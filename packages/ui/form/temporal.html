<haven-glass-surface>
  <mat-form-field [appearance]="appearance()">
    <mat-label>{{ label() }}</mat-label>
    <input
      #control
      matInput
      [type]="nativeType()"
      [attr.lang]="localization.locale()"
      [value]="value() ?? ''"
      (input)="onInput(control)"
      (blur)="touch.emit()"
      [disabled]="disabled()"
      [readonly]="readonly()"
      [required]="required()"
      [attr.min]="minimum() ?? null"
      [attr.max]="maximum() ?? null"
      step="1"
      [errorStateMatcher]="temporalErrorMatcher"
    />
    @if (description()) { <mat-hint>{{ description() }}</mat-hint> } @for (error of
    presentedErrors(); track $index) { <mat-error>{{ localization.error(error) }}</mat-error> }
  </mat-form-field>
</haven-glass-surface>
